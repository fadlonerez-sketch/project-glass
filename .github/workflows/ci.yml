name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      # Off-screen subset only: no shell process, no QML render subprocess, no live UI Automation
      # targets, no input injection.
      - name: Tests (off-screen)
        run: >-
          python -m pytest -p no:cacheprovider
          tests/core tests/shell tests/automation/test_units.py tests/automation/test_server.py
          -m "not slow"
          --ignore tests/shell/test_shell_process.py
          --ignore tests/shell/test_dock_qml.py
